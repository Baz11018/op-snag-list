<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#4f46ff">

<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#111318;--muted:#777e8b;--line:#e5e8ef;--green:#1f9f58;--orange:#ee941d;--red:#d94c55}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:var(--text)}button,input,textarea{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:95px}.top{position:sticky;top:0;z-index:9;padding:calc(12px + env(safe-area-inset-top)) 15px 9px;background:rgba(244,246,251,.93);backdrop-filter:blur(18px)}.grad{color:#fff;background:linear-gradient(135deg,#17c8ff,#2e81ff 48%,#7650ff);border-radius:22px;padding:18px 19px;box-shadow:0 12px 30px rgba(70,91,255,.22)}.grad h1{font-size:29px;margin:0}.grad p{margin:5px 0 0;opacity:.9}.wrap{padding:8px 15px 28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 7px 24px rgba(24,34,52,.06)}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:19px;font-weight:800}.small{font-size:13px;color:var(--muted)}.chev{font-size:28px;color:#9ea5b1}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:780}.primary{color:white;background:linear-gradient(135deg,#179fff,#326eff 50%,#7450ff)}.secondary{background:#edf1f7}.danger{background:#fff0f1;color:#c5444e}.block{width:100%}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:16px;overflow:hidden;margin:12px 0}.count{background:white;text-align:center;padding:12px 5px}.count b{display:block;font-size:27px}.green{color:var(--green)}.orange{color:var(--orange)}label{font-size:13px;font-weight:750;display:block;margin:12px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #dfe3eb;border-radius:12px;background:white;outline:none}textarea{min-height:82px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:12px;font-weight:800;border-radius:999px;padding:6px 9px}.pill.open{background:#fff0da;color:#a96613}.pill.done{background:#e4f7eb;color:#147d46}.thumbrow{display:flex;gap:6px;margin-top:9px;overflow:hidden}.thumbrow img{width:66px;height:56px;object-fit:cover;border-radius:9px;border:1px solid var(--line);pointer-events:none}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.photo{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#eef1f5}.photo img{width:100%;height:100%;object-fit:cover;pointer-events:none}.photoBtns{position:absolute;left:4px;right:4px;bottom:4px;display:flex;justify-content:space-between}.photoBtns button{border:0;background:rgba(255,255,255,.93);border-radius:8px;padding:5px 7px;font-size:12px}.section{font-weight:850;font-size:13px;text-transform:uppercase;letter-spacing:.45px;color:#6d7480;margin:18px 1px 6px}.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 14px calc(7px + env(safe-area-inset-bottom));z-index:10}.tabsin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tab{background:none;border:0;color:#8a919d;font-size:12px;font-weight:750;padding:6px}.tab b{display:block;font-size:18px}.tab.on{color:#2778ff}.back{border:0;background:#fff;border-radius:11px;padding:7px 10px;font-weight:750;margin-bottom:8px}.preview{background:#fff;border:1px solid #dde1e7;border-radius:10px;padding:16px;margin:10px 0}.roomHead{background:#eff0f2;font-weight:850;padding:7px 8px;margin:11px 0 7px}.snagPrev{border-bottom:1px solid #e8eaee;padding:7px 1px 12px}.prevPhotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.prevPhotos img{width:100%;aspect-ratio:1.45/1;object-fit:cover;border-radius:5px}.badge{font-size:11px;color:#236fc4;background:#e8f3ff;padding:5px 8px;border-radius:999px;font-weight:800}.toast{position:fixed;z-index:99;left:50%;bottom:105px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 13px;border-radius:11px;opacity:0;transition:.2s}.toast.show{opacity:1}
</style></head><body><div id="app" class="app"></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>
const DB='op-snag-list-db',VER=1,$=s=>document.querySelector(s),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(36).slice(2),today=()=>new Date().toISOString().slice(0,10),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let db,state={reports:[],templateName:'',templateBytes:null},view={screen:'reports',tab:'reports',reportId:null,roomId:null,snagId:null,filter:'all'},draft=null,urls=[];
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}
function odb(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function get(st,k){return new Promise((res,rej)=>{let r=db.transaction(st).objectStore(st).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(st,k,v){return new Promise((res,rej)=>{let r=db.transaction(st,'readwrite').objectStore(st).put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function del(st,k){return new Promise((res,rej)=>{let r=db.transaction(st,'readwrite').objectStore(st).delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}async function save(){await put('meta','state',state)}async function load(){let s=await get('meta','state');if(s)state=s}
async function optimize(file,long=1100,q=.78){let b=await createImageBitmap(file),sc=Math.min(1,long/Math.max(b.width,b.height)),w=Math.round(b.width*sc),h=Math.round(b.height*sc),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(b,0,0,w,h);b.close?.();return new Promise(r=>c.toBlob(r,'image/jpeg',q))}async function addPhoto(f){let id=uid(),blob=await optimize(f,1100,.78),thumb=await optimize(f,240,.65);await put('photos',id,{blob,thumb});return id}async function purl(id,thumb=true){let r=await get('photos',id);return r?URL.createObjectURL(thumb?r.thumb:r.blob):''}
function report(){return state.reports.find(x=>x.id===view.reportId)}function room(){return report()?.rooms.find(x=>x.id===view.roomId)}function count(r){let t=0,d=0;r.rooms.forEach(a=>a.snags.forEach(s=>{t++;if(s.resolved)d++}));return{total:t,resolved:d,open:t-d}}function rc(a){let t=a.snags.length,d=a.snags.filter(s=>s.resolved).length;return{total:t,resolved:d,open:t-d}}
function tabs(){return `<div class="tabs"><div class="tabsin"><button class="tab ${view.tab==='reports'?'on':''}" onclick="goReports()"><b>▣</b>Reports</button><button class="tab ${view.tab==='template'?'on':''}" onclick="goTemplate()"><b>▤</b>Template</button><button class="tab ${view.tab==='settings'?'on':''}" onclick="goSettings()"><b>⚙</b>Settings</button></div></div>`}function grad(t,s,b='goReports()'){return `<div class="top"><button class="back" onclick="${b}">‹ Back</button><div class="grad"><h1>${esc(t)}</h1><p>${esc(s||'')}</p></div></div>`}
function render(){urls.forEach(URL.revokeObjectURL);urls=[];let a=$('#app');if(view.screen==='reports')a.innerHTML=home()+tabs();if(view.screen==='new')a.innerHTML=newRep();if(view.screen==='report')a.innerHTML=repView();if(view.screen==='room')a.innerHTML=roomView();if(view.screen==='edit')a.innerHTML=editView();if(view.screen==='preview')a.innerHTML=previewView();if(view.screen==='template')a.innerHTML=templateView()+tabs();if(view.screen==='settings')a.innerHTML=settingsView()+tabs();hydrate()}
function home(){return `<div class="top"><div class="grad"><h1>OP Snag List</h1><p>Site snag reports, made simple.</p></div></div><div class="wrap">${state.reports.length?state.reports.map(r=>{let c=count(r);return `<div class="card" onclick="openRep('${r.id}')"><div class="between"><div><div class="title">${esc(r.title)}</div><div style="margin-top:5px"><b class="${c.resolved===c.total&&c.total?'green':'orange'}">${c.resolved}</b>/${c.total} resolved</div><div class="small" style="margin-top:4px">${fmt(r.date)}</div></div><div class="chev">›</div></div></div>`}).join(''):`<div class="card"><b>No reports yet.</b><div class="small">Create your first snag report.</div></div>`}<button class="btn primary block" onclick="view.screen='new';render()">＋ New Report</button></div>`}
function newRep(){return grad('New Report','Create a new site snag report')+`<div class="wrap"><div class="card"><label>Project / Report title</label><input id="rt" placeholder="e.g. Balqis 403"><label>Date</label><input id="rd" type="date" value="${today()}"><label>Unit / Reference (optional)</label><input id="rr" placeholder="e.g. Apartment 403"><label>Notes (optional)</label><textarea id="rn"></textarea></div><button class="btn primary block" onclick="createRep()">Create Report</button></div>`}async function createRep(){let t=$('#rt').value.trim();if(!t)return toast('Enter a title');let r={id:uid(),title:t,date:$('#rd').value||today(),reference:$('#rr').value.trim(),notes:$('#rn').value.trim(),rooms:[]};state.reports.unshift(r);await save();view.reportId=r.id;view.screen='report';render()}
function repView(){let r=report(),c=count(r);return grad(r.title,fmt(r.date))+`<div class="wrap"><div class="counts"><div class="count"><b class="green">${c.resolved}</b><span class="small">Resolved</span></div><div class="count"><b class="orange">${c.open}</b><span class="small">Open</span></div><div class="count"><b>${c.total}</b><span class="small">Total</span></div></div>${r.rooms.map(a=>{let x=rc(a);return `<div class="card" onclick="openRoom('${a.id}')"><div class="between"><div><div class="title">${esc(a.name)}</div><div class="small">${x.total} snags · ${x.resolved} resolved ${x.open?`· <span class="orange">${x.open} open</span>`:''}</div></div><div class="chev">›</div></div></div>`}).join('')}<button class="btn primary block" onclick="addRoom()">＋ Add Room</button><div class="toolbar" style="margin-top:9px"><button class="btn secondary" style="flex:1" onclick="editRep()">Edit details</button><button class="btn secondary" style="flex:1" onclick="openPreview()">Preview report</button></div></div>`}async function addRoom(){let n=prompt('Room name','Master Bedroom');if(!n?.trim())return;report().rooms.push({id:uid(),name:n.trim(),snags:[]});await save();render()}async function editRep(){let r=report(),t=prompt('Report title',r.title);if(!t)return;r.title=t.trim();let d=prompt('Date YYYY-MM-DD',r.date);if(d)r.date=d;await save();render()}
function roomView(){let a=room(),c=rc(a);return grad(a.name,`${c.total} snags · ${c.resolved} resolved`,"view.screen='report';render()")+`<div class="wrap">${a.snags.map((s,i)=>`<div class="card"><div class="between"><div><div class="title">${String(i+1).padStart(2,'0')} · ${esc(s.title)}</div>${s.note?`<div class="small" style="margin-top:5px">${esc(s.note)}</div>`:''}</div><span class="pill ${s.resolved?'done':'open'}">${s.resolved?'✓ Resolved':'Open'}</span></div><div class="thumbrow" data-ids="${s.before.join(',')}"></div>${s.after.length?`<div class="small" style="margin-top:7px">Completion photos</div><div class="thumbrow" data-ids="${s.after.join(',')}"></div>`:''}<div class="toolbar" style="margin-top:11px"><button class="btn secondary" onclick="editSnag('${s.id}')">Edit</button><button class="btn ${s.resolved?'secondary':'primary'}" onclick="toggle('${s.id}')">${s.resolved?'Mark Open':'✓ Resolve'}</button><button class="btn danger" onclick="removeSnag('${s.id}')">Delete</button></div></div>`).join('')}<button class="btn primary block" onclick="newSnag()">＋ Add Snag</button><button class="btn secondary block" style="margin-top:8px" onclick="renameRoom()">Rename room</button></div>`}async function renameRoom(){let a=room(),n=prompt('Room name',a.name);if(n?.trim()){a.name=n.trim();await save();render()}}function newSnag(){draft={id:uid(),title:'',note:'',date:today(),resolved:false,before:[],after:[],fresh:true};view.snagId=null;view.screen='edit';render()}function editSnag(id){let s=room().snags.find(x=>x.id===id);draft=structuredClone(s);draft.fresh=false;view.snagId=id;view.screen='edit';render()}
function editView(){return grad(draft.fresh?'Add Snag':'Edit Snag',room().name,"view.screen='room';render()")+`<div class="wrap"><div class="card"><label>Snag title / short description</label><input id="st" value="${esc(draft.title)}" placeholder="e.g. Cabinet touch-up"><label>Notes (optional)</label><textarea id="sn">${esc(draft.note)}</textarea><label>Date</label><input id="sd" type="date" value="${draft.date||today()}"><div class="section">Before photos · live preview</div><input type="file" accept="image/*" multiple onchange="addDraft('before',this.files)"><div id="beforeGrid" class="photoGrid"></div><div class="section">Completion photos (optional)</div><input type="file" accept="image/*" multiple onchange="addDraft('after',this.files)"><div id="afterGrid" class="photoGrid"></div></div><button class="btn primary block" onclick="saveSnag()">Save Snag</button></div>`}function syncDraftForm(){if(!draft)return;let t=$('#st'),n=$('#sn'),d=$('#sd');if(t)draft.title=t.value;if(n)draft.note=n.value;if(d)draft.date=d.value||today()}async function addDraft(k,fs){syncDraftForm();for(let i=0;i<fs.length;i++){toast(`Optimizing ${i+1}/${fs.length}`);draft[k].push(await addPhoto(fs[i]));await new Promise(r=>setTimeout(r,40))}render()}function move(k,i,d){syncDraftForm();let a=draft[k],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}async function remPhoto(k,i){syncDraftForm();let[id]=draft[k].splice(i,1);await del('photos',id);render()}async function saveSnag(){syncDraftForm();draft.title=draft.title.trim();draft.note=draft.note.trim();draft.date=draft.date||today();if(!draft.title)return toast('Enter snag title');if(draft.fresh){delete draft.fresh;room().snags.push(draft)}else{let i=room().snags.findIndex(x=>x.id===view.snagId);delete draft.fresh;room().snags[i]=draft}await save();draft=null;view.screen='room';render()}async function toggle(id){let s=room().snags.find(x=>x.id===id);s.resolved=!s.resolved;await save();if(s.resolved&&!s.after.length&&confirm('Resolved. Add a completion photo now?')){editSnag(id);return}render()}async function removeSnag(id){if(!confirm('Delete this snag?'))return;let a=room(),i=a.snags.findIndex(x=>x.id===id),s=a.snags[i];for(let p of [...s.before,...s.after])await del('photos',p);a.snags.splice(i,1);await save();render()}
function openPreview(){view.filter='all';view.screen='preview';render()}function previewView(){let r=report(),c=count(r);return grad('Preview',`${r.title} · ${c.resolved}/${c.total} resolved`,"view.screen='report';render()")+`<div class="wrap"><div class="toolbar"><button class="btn secondary" onclick="filter('all')">All</button><button class="btn secondary" onclick="filter('open')">Open only</button><button class="btn secondary" onclick="filter('resolved')">Resolved only</button></div><div class="preview"><div class="between"><div><div class="title">${esc(r.title)}</div><div class="small">${fmt(r.date)}</div></div><span class="badge">LIVE PREVIEW</span></div>${prevBody(r)}</div><button class="btn primary block" onclick="pdf()">Generate PDF</button></div>`}function filter(f){view.filter=f;render()}function prevBody(r){let h='';for(let a of r.rooms){let ss=a.snags.filter(s=>view.filter==='all'||view.filter==='open'&&!s.resolved||view.filter==='resolved'&&s.resolved);if(!ss.length)continue;h+=`<div class="roomHead">${esc(a.name)}</div>`;for(let s of ss)h+=`<div class="snagPrev"><div class="between"><b>${esc(s.title)}</b><span class="pill ${s.resolved?'done':'open'}">${s.resolved?'Resolved':'Open'}</span></div>${s.note?`<div class="small">${esc(s.note)}</div>`:''}<div class="prevPhotos" data-ids="${s.before.join(',')}"></div>${s.after.length?`<div class="small" style="margin-top:7px"><b>After</b></div><div class="prevPhotos" data-ids="${s.after.join(',')}"></div>`:''}</div>`}return h}
function templateView(){return `<div class="top"><div class="grad"><h1>Template</h1><p>Your company PDF stays private on this iPhone.</p></div></div><div class="wrap"><div class="card"><div class="title">${state.templateName?'Template ready':'Select RELIABLE template'}</div><div class="small" style="margin-top:5px">${state.templateName?esc(state.templateName):'Choose the same clean PDF used for OP Photo Report. OP Snag List uses its real header and footer, while building the snag layout in the blank central area.'}</div><input type="file" accept="application/pdf" style="margin-top:12px" onchange="saveTemplate(this.files[0])">${state.templateName?`<button class="btn danger block" style="margin-top:9px" onclick="rmTemplate()">Remove template</button>`:''}</div></div>`}async function saveTemplate(f){if(!f)return;let src=await PDFLib.PDFDocument.load(new Uint8Array(await f.arrayBuffer()));if(src.getPageCount()<2)return toast('Template needs 2 pages');let d=await PDFLib.PDFDocument.create(),p=await d.copyPages(src,[0,1]);p.forEach(x=>d.addPage(x));let b=await d.save({useObjectStreams:true});state.templateName=f.name;state.templateBytes=b.buffer;await save();toast('Template saved');render()}async function rmTemplate(){state.templateName='';state.templateBytes=null;await save();render()}
function settingsView(){let n=0;state.reports.forEach(r=>r.rooms.forEach(a=>a.snags.forEach(s=>n+=s.before.length+s.after.length)));return `<div class="top"><div class="grad"><h1>Settings</h1><p>OP Snag List v4 · Status Update</p></div></div><div class="wrap"><div class="card"><b>${state.reports.length} reports · ${n} optimized photos</b><div class="small" style="margin-top:6px">All report data stays on this device. GitHub hosts only the app code and icons.</div></div></div>`}
async function hydrate(){for(let e of document.querySelectorAll('[data-ids]')){let ids=e.dataset.ids.split(',').filter(Boolean);e.innerHTML='';for(let id of ids){let u=await purl(id,true);if(!u)continue;urls.push(u);let im=document.createElement('img');im.src=u;e.appendChild(im)}}if(view.screen==='edit'){await fillGrid('beforeGrid','before');await fillGrid('afterGrid','after')}}async function fillGrid(id,k){let e=document.getElementById(id);if(!e)return;e.innerHTML='';for(let i=0;i<draft[k].length;i++){let u=await purl(draft[k][i],true);urls.push(u);let d=document.createElement('div');d.className='photo';d.innerHTML=`<img src="${u}"><div class="photoBtns"><button onclick="move('${k}',${i},-1)">←</button><button onclick="remPhoto('${k}',${i})">✕</button><button onclick="move('${k}',${i},1)">→</button></div>`;e.appendChild(d)}}
async function pdf(){let r=report();if(!state.templateBytes){alert('First select your RELIABLE PDF template in the Template tab.');return}toast('Creating PDF...');let src=await PDFLib.PDFDocument.load(new Uint8Array(state.templateBytes)),out=await PDFLib.PDFDocument.create(),font=await out.embedFont(PDFLib.StandardFonts.Helvetica),bold=await out.embedFont(PDFLib.StandardFonts.HelveticaBold),rgb=PDFLib.rgb,L=48,R=548,TOP=650,BOT=96,W=500,page,y,roomName=null,seq=1,snagsOnPage=0;
async function np(){let[p]=await out.copyPages(src,[1]);out.addPage(p);page=p;y=TOP;roomName=null;snagsOnPage=0;page.drawText('SNAG LIST REPORT',{x:L,y:718,size:13,font:bold});page.drawText(r.title,{x:L,y:688,size:15,font:bold});page.drawText(fmt(r.date),{x:R-82,y:690,size:10,font})}
async function rh(n){if(y<150)await np();page.drawRectangle({x:L,y:y-23,width:W,height:23,color:rgb(.94,.945,.95)});page.drawText(n,{x:L+8,y:y-16,size:12,font:bold});y-=31;roomName=n}
async function emb(id){let rec=await get('photos',id);if(!rec)return null;return out.embedJpg(new Uint8Array(await rec.blob.arrayBuffer()))}
async function imgs(ids,label){if(!ids.length)return;if(label){page.drawText(label,{x:L+39,y:y-9,size:7.5,font:bold});y-=16}let pw=205,ph=105,g=18,rowH=114;for(let i=0;i<ids.length;i++){if(i>0&&i%2===0)y-=rowH;let im=await emb(ids[i]);if(!im)continue;let sc=Math.min(pw/im.width,ph/im.height),ww=im.width*sc,hh=im.height*sc,x=L+39+(i%2)*(pw+g);page.drawImage(im,{x:x+(pw-ww)/2,y:y-ph+(ph-hh)/2,width:ww,height:hh})}y-=rowH}

async function snag(s,n,rm){let h=estimate(s);if(snagsOnPage>=2){await np()}if(roomName!==rm)await rh(rm);if(y-h<BOT){await np();await rh(rm)}let top=y;page.drawRectangle({x:L,y:y-h+4,width:W,height:h-4,borderColor:rgb(.87,.88,.9),borderWidth:.7});page.drawText(String(n).padStart(2,'0'),{x:L+8,y:y-19,size:10,font:bold});page.drawText(s.title.slice(0,60),{x:L+39,y:y-19,size:10.5,font:bold});y-=31;let statusX=L+39,statusW=W-51,statusH=22,statusColor=s.resolved?rgb(.76,.93,.80):rgb(1,.87,.58),statusText=s.resolved?'✓  RESOLVED':'OPEN  —  TO BE COMPLETED';page.drawRectangle({x:statusX,y:y-statusH+3,width:statusW,height:statusH,color:statusColor});let tw=bold.widthOfTextAtSize(statusText,9.5);page.drawText(statusText,{x:statusX+(statusW-tw)/2,y:y-12,size:9.5,font:bold});y-=31;if(s.note){page.drawText(s.note.slice(0,110),{x:L+39,y:y-10,size:8.5,font});y-=18}await imgs(s.before,'');await imgs(s.after,'AFTER');y=top-h;snagsOnPage++}

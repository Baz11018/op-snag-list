<style>

und:#fff0da;color:#a96613}.pill.done{background:#e4f7eb;color:#147d46}.thumbrow{display:flex;gap:6px;margin-top:9px;overflow:hidden}.thumbrow img{width:66px;height:56px;object-fit:cover;border-radius:9px;border:1px solid var(--line);pointer-events:none}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.photo{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#eef1f5}.photo img{width:100%;height:100%;object-fit:cover;pointer-events:none}.photoBtns{position:absolute;left:4px;right:4px;bottom:4px;display:flex;justify-content:space-between}.photoBtns button{border:0;background:rgba(255,255,255,.93);border-radius:8px;padding:5px 7px;font-size:12px}.section{font-weight:850;font-size:13px;text-transform:uppercase;letter-spacing:.45px;color:#6d7480;margin:18px 1px 6px}.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 14px calc(7px + env(safe-area-inset-bottom));z-index:10}.tabsin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tab{background:none;border:0;color:#8a919d;font-size:12px;font-weight:750;padding:6px}.tab b{display:block;font-size:18px}.tab.on{color:#2778ff}.back{border:0;background:#fff;border-radius:11px;padding:7px 10px;font-weight:750;margin-bottom:8px}.preview{background:#fff;border:1px solid #dde1e7;border-radius:10px;padding:16px;margin:10px 0}.roomHead{background:#eff0f2;font-weight:850;padding:7px 8px;margin:11px 0 7px}.snagPrev{border-bottom:1px solid #e8eaee;padding:7px 1px 12px}.prevPhotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.prevPhotos img{width:100%;aspect-ratio:1.45/1;object-fit:cover;border-radius:5px}.badge{font-size:11px;color:#236fc4;background:#e8f3ff;padding:5px 8px;border-radius:999px;font-weight:800}.toast{position:fixed;z-index:99;left:50%;bottom:105px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 13px;border-radius:11px;opacity:0;transition:.2s}.toast.show{opacity:1}
.splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#20d7f4 0%,#126cff 48%,#c442f0 100%);transition:opacity .28s ease,visibility .28s ease}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}.splashInner{text-align:center;color:#fff;padding:24px}.splashLogo{font-size:74px;font-weight:900;letter-spacing:-4px;line-height:.88;text-shadow:0 6px 18px rgba(0,0,0,.18)}.splashName{font-size:28px;font-weight:850;margin-top:10px;text-shadow:0 4px 12px rgba(0,0,0,.16)}.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;margin:28px auto 10px;animation:spin .8s linear infinite}.loadingText{font-size:13px;font-weight:700;opacity:.9;letter-spacing:.2px}@keyframes spin{to{transform:rotate(360deg)}}
.photoLightbox{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:22px}.photoLightbox img{max-width:100%;max-height:100%;object-fit:contain}.photoLightboxClose{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#111;font-size:25px;line-height:40px;font-weight:700;padding:0}.thumbrow img,.prevPhotos img{cursor:zoom-in}
.pdfReadyCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 7px 24px rgba(24,34,52,.06)}.pdfPage{width:100%;height:auto;display:block;background:#fff;margin:10px auto;border:1px solid #dfe3eb;border-radius:6px;box-shadow:0 4px 14px rgba(24,34,52,.08)}.pdfMeta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.pdfPreviewWrap{background:#e9edf4;border-radius:14px;padding:8px;max-height:58vh;overflow:auto;-webkit-overflow-scrolling:touch}
</style></head><body><div id="splash" class="splash"><div class="splashInner"><div class="splashLogo">OP</div><div class="splashName">Snag List</div><div class="spinner"></div><div class="loadingText">Loading…</div></div></div><div id="app" class="app"></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script><script>
const DB='op-snag-list-db',VER=1,$=s=>document.querySelector(s),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(36).slice(2),today=()=>new Date().toISOString().slice(0,10),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let db,state={reports:[],templateName:'',templateBytes:null},view={screen:'reports',tab:'reports',reportId:null,roomId:null,snagId:null,filter:'all'},draft=null,urls=[],generatedPdf=null,lightboxUrl=null;
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}
function odb(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function get(st,k){return new Promise((res,rej)=>{let r=db.transaction(st).objectStore(st).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(st,k,v){return new Promise((res,rej)=>{let r=db.transaction(st,'readwrite').objectStore(st).put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function del(st,k){return new Promise((res,rej)=>{let r=db.transaction(st,'readwrite').objectStore(st).delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}async function save(){await put('meta','state',state)}async function load(){let s=await get('meta','state');if(s)state=s}
function clearStore(st){return new Promise((res,rej)=>{let r=db.transaction(st,'readwrite').objectStore(st).clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
const stamp=()=>new Date().toISOString(),fmtStamp=v=>v?new Date(v).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Never',mb=n=>n?`${(n/1048576).toFixed(n<1048576?2:1)} MB`:'Not generated';
async function saveFile(blob,name,title=name){let file=new File([blob],name,{type:blob.type||'application/octet-stream'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title});return true}catch(e){if(e?.name==='AbortError')return false}}let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);return true}
function photoIdsOfReport(r){let ids=[];r.rooms.forEach(a=>a.snags.forEach(s=>ids.push(...(s.before||[]),...(s.after||[]))));return [...new Set(ids)]}
async function addPhotosToZip(zip,ids){for(let id of ids){let rec=await get('photos',id);if(!rec)continue;zip.file(`photos/${id}.jpg`,rec.blob);zip.file(`photos/${id}-thumb.jpg`,rec.thumb)}}
async function exportReportBackup(id=view.reportId){let r=state.reports.find(x=>x.id===id);if(!r)return;toast('Creating report backup...');let zip=new JSZip(),meta={type:'op-snag-report-backup',version:1,createdAt:stamp(),report:structuredClone(r)};zip.file('backup.json',JSON.stringify(meta,null,2));await addPhotosToZip(zip,photoIdsOfReport(r));let blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}}),name=(r.title+' - OP Snag Backup.zip').replace(/[\/:*?"<>|]/g,'-');let ok=await saveFile(blob,name,'OP Snag List backup');if(ok){r.lastBackupAt=stamp();r.lastBackupBytes=blob.size;await save();toast('Report backup saved');render()}}
async function exportAllBackup(){toast('Creating full backup...');let zip=new JSZip(),copy=structuredClone(state);copy.templateBytes=null;zip.file('backup.json',JSON.stringify({type:'op-snag-full-backup',version:1,createdAt:stamp(),state:copy},null,2));let ids=[];state.reports.forEach(r=>ids.push(...photoIdsOfReport(r)));await addPhotosToZip(zip,[...new Set(ids)]);if(state.templateBytes)zip.file('template.pdf',new Uint8Array(state.templateBytes));let blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}}),name=`OP Snag List - Full Backup - ${today()}.zip`;let ok=await saveFile(blob,name,'OP Snag List full backup');if(ok){state.lastFullBackupAt=stamp();state.lastFullBackupBytes=blob.size;await save();toast('Full backup saved');render()}}
async function restoreBackupFile(file){if(!file)return;try{toast('Reading backup...');let zip=await JSZip.loadAsync(file),entry=zip.file('backup.json');if(!entry)throw new Error('Invalid backup');let meta=JSON.parse(await entry.async('string'));if(meta.type==='op-snag-report-backup')await restoreReportZip(zip,meta);else if(meta.type==='op-snag-full-backup')await restoreFullZip(zip,meta);else throw new Error('Unknown backup type')}catch(e){console.error(e);alert('This file is not a valid OP Snag List backup.')}}
async function restoreReportZip(zip,meta){let src=meta.report;if(!src?.rooms)throw new Error('Invalid report backup');let map={},r=structuredClone(src);r.id=uid();r.title=src.title+(state.reports.some(x=>x.title===src.title)?' (Restored)':'');r.lastBackupAt=meta.createdAt;r.lastBackupBytes=null;for(let a of r.rooms){a.id=uid();for(let s of a.snags){s.id=uid();for(let key of ['before','after']){let arr=[];for(let old of s[key]||[]){if(!map[old]){let full=zip.file(`photos/${old}.jpg`),th=zip.file(`photos/${old}-thumb.jpg`);if(!full)continue;let nid=uid(),blob=await full.async('blob'),thumb=th?await th.async('blob'):await optimize(new File([blob],'photo.jpg',{type:'image/jpeg'}),240,.65);await put('photos',nid,{blob,thumb});map[old]=nid}arr.push(map[old])}s[key]=arr}}}state.reports.unshift(r);await save();toast('Report restored');view.reportId=r.id;view.screen='report';view.tab='reports';render()}
async function restoreFullZip(zip,meta){if(!confirm('Restore the full backup? This will replace the reports currently stored on this device.'))return;await clearStore('photos');let ns=meta.state||{};ns.reports=ns.reports||[];let files=Object.keys(zip.files).filter(n=>/^photos\/.*\.jpg$/.test(n)&&!/-thumb\.jpg$/.test(n));for(let path of files){let old=path.slice(7,-4),full=zip.file(path),th=zip.file(`photos/${old}-thumb.jpg`),blob=await full.async('blob'),thumb=th?await th.async('blob'):await optimize(new File([blob],'photo.jpg',{type:'image/jpeg'}),240,.65);await put('photos',old,{blob,thumb})}let tp=zip.file('template.pdf');ns.templateBytes=tp?await tp.async('arraybuffer'):null;ns.lastFullBackupAt=meta.createdAt;state=ns;await save();toast('Full backup restored');goReports()}

async function optimize(file,long=1100,q=.78){let b=await createImageBitmap(file),sc=Math.min(1,long/Math.max(b.width,b.height)),w=Math.round(b.width*sc),h=Math.round(b.height*sc),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(b,0,0,w,h);b.close?.();return new Promise(r=>c.toBlob(r,'image/jpeg',q))}async function addPhoto(f){let id=uid(),blob=await optimize(f,1100,.78),thumb=await optimize(f,240,.65);await put('photos',id,{blob,thumb});return id}async function purl(id,thumb=true){let r=await get('photos',id);return r?URL.createObjectURL(thumb?r.thumb:r.blob):''}
function report(){return state.reports.find(x=>x.id===view.reportId)}function room(){return report()?.rooms.find(x=>x.id===view.roomId)}function count(r){let t=0,d=0;r.rooms.forEach(a=>a.snags.forEach(s=>{t++;if(s.resolved)d++}));return{total:t,resolved:d,open:t-d}}function rc(a){let t=a.snags.length,d=a.snags.filter(s=>s.resolved).length;return{total:t,resolved:d,open:t-d}}
function tabs(){return `<div class="tabs"><div class="tabsin"><button class="tab ${view.tab==='reports'?'on':''}" onclick="goReports()"><b>▣</b>Reports</button><button class="tab ${view.tab==='template'?'on':''}" onclick="goTemplate()"><b>▤</b>Template</button><button class="tab ${view.tab==='settings'?'on':''}" onclick="goSettings()"><b>⚙</b>Settings</button></div></div>`}function grad(t,s,b='goReports()'){return `<div class="top"><button class="back" onclick="${b}">‹ Back</button><div class="grad"><h1>${esc(t)}</h1><p>${esc(s||'')}</p></div></div>`}
function render(){urls.forEach(URL.revokeObjectURL);urls=[];let a=$('#app');if(view.screen==='reports')a.innerHTML=home()+tabs();if(view.screen==='new')a.innerHTML=newRep();if(view.screen==='report')a.innerHTML=repView();if(view.screen==='room')a.innerHTML=roomView();if(view.screen==='edit')a.innerHTML=editView();if(view.screen==='preview')a.innerHTML=previewView();if(view.screen==='pdfready')a.innerHTML=pdfReadyView();if(view.screen==='template')a.innerHTML=templateView()+tabs();if(view.screen==='settings')a.innerHTML=settingsView()+tabs();hydrate()}
function home(){return `<div class="top"><div class="grad"><h1>OP Snag List</h1><p>Site snag reports, made simple.</p></div></div><div class="wrap">${state.reports.length?state.reports.map(r=>{let c=count(r);return `<div class="card" onclick="openRep('${r.id}')"><div class="between"><div><div class="title">${esc(r.title)}</div><div style="margin-top:5px"><b class="${c.resolved===c.total&&c.total?'green':'orange'}">${c.resolved}</b>/${c.total} resolved</div><div class="small" style="margin-top:4px">${fmt(r.date)}</div></div><div class="chev">›</div></div><button class="btn danger" style="margin-top:11px" onclick="event.stopPropagation();deleteReport('${r.id}')">Delete report</button></div>`}).join(''):`<div class="card"><b>No reports yet.</b><div class="small">Create your first snag report.</div></div>`}<button class="btn primary block" onclick="view.screen='new';render()">＋ New Report</button></div>`}
function newRep(){return grad('New Report','Create a new site snag report')+`<div class="wrap"><div class="card"><label>Project / Report title</label><input id="rt" placeholder="e.g. Balqis 403"><label>Date</label><input id="rd" type="date" value="${today()}"><label>Unit / Reference (optional)</label><input id="rr" placeholder="e.g. Apartment 403"><label>Notes (optional)</label><textarea id="rn"></textarea></div><button class="btn primary block" onclick="createRep()">Create Report</button></div>`}async function createRep(){let t=$('#rt').value.trim();if(!t)return toast('Enter a title');let r={id:uid(),title:t,date:$('#rd').value||today(),reference:$('#rr').value.trim(),notes:$('#rn').value.trim(),rooms:[],lastBackupAt:null,lastPdfAt:null,lastPdfBytes:null,lastPdfFilter:null};state.reports.unshift(r);await save();view.reportId=r.id;view.screen='report';render()}async function deleteReport(id){let r=state.reports.find(x=>x.id===id);if(!r)return;if(!confirm(`Delete report \"${r.title}\"? This action cannot be undone.`))return;for(let pid of photoIdsOfReport(r))await del('photos',pid);state.reports=state.reports.filter(x=>x.id!==id);await save();render();toast('Report deleted')}
function repView(){let r=report(),c=count(r);return grad(r.title,fmt(r.date))+`<div class="wrap"><div class="counts"><div class="count"><b class="green">${c.resolved}</b><span class="small">Resolved</span></div><div class="count"><b class="orange">${c.open}</b><span class="small">Open</span></div><div class="count"><b>${c.total}</b><span class="small">Total</span></div></div>${r.rooms.map(a=>{let x=rc(a);return `<div class="card" onclick="openRoom('${a.id}')"><div class="between"><div><div class="title">${esc(a.name)}</div><div class="small">${x.total} snags · ${x.resolved} resolved ${x.open?`· <span class="orange">${x.open} open</span>`:''}</div></div><div class="chev">›</div></div></div>`}).join('')}<button class="btn primary block" onclick="addRoom()">＋ Add Room</button><div class="toolbar" style="margin-top:9px"><button class="btn secondary" style="flex:1" onclick="editRep()">Edit details</button><button class="btn secondary" style="flex:1" onclick="openPreview()">Preview report</button></div><button class="btn secondary block" style="margin-top:8px" onclick="exportReportBackup('${r.id}')">⬇︎ Backup this report</button><div class="small" style="text-align:center;margin-top:6px">Last backup: ${fmtStamp(r.lastBackupAt)}</div></div>`}async function addRoom(){let n=prompt('Room name','Master Bedroom');if(!n?.trim())return;report().rooms.push({id:uid(),name:n.trim(),snags:[]});await save();render()}async function editRep(){let r=report(),t=prompt('Report title',r.title);if(!t)return;r.title=t.trim();let d=prompt('Date YYYY-MM-DD',r.date);if(d)r.date=d;await save();render()}
function roomView(){let a=room(),c=rc(a);return grad(a.name,`${c.total} snags · ${c.resolved} resolved`,"view.screen='report';render()")+`<div class="wrap">${a.snags.map((s,i)=>`<div class="card"><div class="between"><div><div class="title">${String(i+1).padStart(2,'0')} · ${esc(s.title)}</div>${s.note?`<div class="small" style="margin-top:5px">${esc(s.note)}</div>`:''}</div><span class="pill ${s.resolved?'done':'open'}">${s.resolved?'✓ Resolved':'Open'}</span></div><div class="thumbrow" data-ids="${s.before.join(',')}"></div>${s.after.length?`<div class="small" style="margin-top:7px">Completion photos</div><div class="thumbrow" data-ids="${s.after.join(',')}"></div>`:''}<div class="toolbar" style="margin-top:11px"><button class="btn secondary" onclick="editSnag('${s.id}')">Edit</button><button class="btn ${s.resolved?'secondary':'primary'}" onclick="toggle('${s.id}')">${s.resolved?'Mark Open':'✓ Resolve'}</button><button class="btn danger" onclick="removeSnag('${s.id}')">Delete</button></div></div>`).join('')}<button class="btn primary block" onclick="newSnag()">＋ Add Snag</button><button class="btn secondary block" style="margin-top:8px" onclick="renameRoom()">Rename room</button></div>`}async function renameRoom(){let a=room(),n=prompt('Room name',a.name);if(n?.trim()){a.name=n.trim();await save();render()}}function newSnag(){draft={id:uid(),title:'',note:'',date:today(),resolved:false,before:[],after:[],fresh:true};view.snagId=null;view.screen='edit';render()}function editSnag(id){let s=room().snags.find(x=>x.id===id);draft=structuredClone(s);draft.fresh=false;view.snagId=id;view.screen='edit';render()}
function editView(){return grad(draft.fresh?'Add Snag':'Edit Snag',room().name,"view.screen='room';render()")+`<div class="wrap"><div class="card"><label>Snag title / short description</label><input id="st" value="${esc(draft.title)}" placeholder="e.g. Cabinet touch-up"><label>Notes (optional)</label><textarea id="sn">${esc(draft.note)}</textarea><label>Date</label><input id="sd" type="date" value="${draft.date||today()}"><div class="section">Before photos · live preview</div><input type="file" accept="image/*" multiple onchange="addDraft('before',this.files)"><div id="beforeGrid" class="photoGrid"></div><div class="section">Completion photos (optional)</div><input type="file" accept="image/*" multiple onchange="addDraft('after',this.files)"><div id="afterGrid" class="photoGrid"></div></div><button class="btn primary block" onclick="saveSnag()">Save Snag</button></div>`}function syncDraftForm(){if(!draft)return;let t=$('#st'),n=$('#sn'),d=$('#sd');if(t)draft.title=t.value;if(n)draft.note=n.value;if(d)draft.date=d.value||today()}async function addDraft(k,fs){syncDraftForm();for(let i=0;i<fs.length;i++){toast(`Optimizing ${i+1}/${fs.length}`);draft[k].push(await addPhoto(fs[i]));await new Promise(r=>setTimeout(r,40))}render()}function move(k,i,d){syncDraftForm();let a=draft[k],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}async function remPhoto(k,i){syncDraftForm();let[id]=draft[k].splice(i,1);await del('photos',id);render()}async function saveSnag(){syncDraftForm();draft.title=draft.title.trim();draft.note=draft.note.trim();draft.date=draft.date||today();if(!draft.title)return toast('Enter snag title');if(draft.fresh){delete draft.fresh;room().snags.push(draft)}else{let i=room().snags.findIndex(x=>x.id===view.snagId);delete draft.fresh;room().snags[i]=draft}await save();draft=null;view.screen='room';render()}async function toggle(id){let s=room().snags.find(x=>x.id===id);s.resolved=!s.resolved;await save();if(s.resolved&&!s.after.length&&confirm('Resolved. Add a completion photo now?')){editSnag(id);return}render()}async function removeSnag(id){if(!confirm('Delete this snag?'))return;let a=room(),i=a.snags.findIndex(x=>x.id===id),s=a.snags[i];for(let p of [...s.before,...s.after])await del('photos',p);a.snags.splice(i,1);await save();render()}
function openPreview(){view.filter='all';view.screen='preview';render()}function previewView(){let r=report(),c=count(r);return grad('Preview',`${r.title} · ${c.resolved}/${c.total} resolved`,"view.screen='report';render()")+`<div class="wrap"><div class="toolbar"><button class="btn secondary" onclick="filter('all')">All</button><button class="btn secondary" onclick="filter('open')">Open only</button><button class="btn secondary" onclick="filter('resolved')">Resolved only</button></div><div class="preview"><div class="between"><div><div class="title">${esc(r.title)}</div><div class="small">${fmt(r.date)}</div></div><span class="badge">LIVE PREVIEW</span></div>${prevBody(r)}</div><button class="btn primary block" onclick="pdf()">Generate PDF</button></div>`}function filter(f){view.filter=f;render()}function prevBody(r){let h='';for(let a of r.rooms){let ss=a.snags.filter(s=>view.filter==='all'||view.filter==='open'&&!s.resolved||view.filter==='resolved'&&s.resolved);if(!ss.length)continue;h+=`<div class="roomHead">${esc(a.name)}</div>`;for(let s of ss)h+=`<div class="snagPrev"><div class="between"><b>${esc(s.title)}</b><span class="pill ${s.resolved?'done':'open'}">${s.resolved?'Resolved':'Open'}</span></div>${s.note?`<div class="small">${esc(s.note)}</div>`:''}<div class="prevPhotos" data-ids="${s.before.join(',')}"></div>${s.after.length?`<div class="small" style="margin-top:7px"><b>After</b></div><div class="prevPhotos" data-ids="${s.after.join(',')}"></div>`:''}</div>`}return h}
function templateView(){return `<div class="top"><div class="grad"><h1>Template</h1><p>Your company PDF stays private on this iPhone.</p></div></div><div class="wrap"><div class="card"><div class="title">${state.templateName?'Template ready':'Select RELIABLE template'}</div><div class="small" style="margin-top:5px">${state.templateName?esc(state.templateName):'Choose the same clean PDF used for OP Photo Report. OP Snag List uses its real header and footer, while building the snag layout in the blank central area.'}</div><input type="file" accept="application/pdf" style="margin-top:12px" onchange="saveTemplate(this.files[0])">${state.templateName?`<button class="btn danger block" style="margin-top:9px" onclick="rmTemplate()">Remove template</button>`:''}</div></div>`}async function saveTemplate(f){if(!f)return;let src=await PDFLib.PDFDocument.load(new Uint8Array(await f.arrayBuffer()));if(src.getPageCount()<2)return toast('Template needs 2 pages');let d=await PDFLib.PDFDocument.create(),p=await d.copyPages(src,[0,1]);p.forEach(x=>d.addPage(x));let b=await d.save({useObjectStreams:true});state.templateName=f.name;state.templateBytes=b.buffer;await save();toast('Template saved');render()}async function rmTemplate(){state.templateName='';state.templateBytes=null;await save();render()}
function settingsView(){let n=0;state.reports.forEach(r=>r.rooms.forEach(a=>a.snags.forEach(s=>n+=s.before.length+s.after.length)));let rows=state.reports.map(r=>`<div class="card"><div class="title">${esc(r.title)}</div><div class="small" style="margin-top:7px"><b>Last PDF:</b> ${mb(r.lastPdfBytes)}${r.lastPdfAt?` · ${fmtStamp(r.lastPdfAt)}${r.lastPdfFilter&&r.lastPdfFilter!=='all'?` · ${esc(r.lastPdfFilter)}`:''}`:''}</div><div class="small" style="margin-top:5px"><b>Last backup:</b> ${fmtStamp(r.lastBackupAt)}${r.lastBackupBytes?` · ${mb(r.lastBackupBytes)}`:''}</div><button class="btn secondary block" style="margin-top:10px" onclick="exportReportBackup('${r.id}')">Backup report</button></div>`).join('');return `<div class="top"><div class="grad"><h1>Settings</h1><p>OP Snag List v4.8 · Backup & Recovery</p></div></div><div class="wrap"><div class="card"><b>${state.reports.length} reports · ${n} optimized photos</b><div class="small" style="margin-top:6px">Reports and photos stay on this device. Backups can be saved to Files or iCloud Drive.</div></div><div class="section">Full backup</div><div class="card"><div class="title">All reports backup</div><div class="small" style="margin-top:6px">Last full backup: ${fmtStamp(state.lastFullBackupAt)}${state.lastFullBackupBytes?` · ${mb(state.lastFullBackupBytes)}`:''}</div><button class="btn primary block" style="margin-top:10px" onclick="exportAllBackup()">Backup all reports</button><label style="margin-top:10px">Restore a backup</label><input type="file" accept=".zip,application/zip" onchange="restoreBackupFile(this.files[0]);this.value=''"><div class="small" style="margin-top:6px">Restore one report backup or a complete app backup.</div></div>${state.reports.length?`<div class="section">Reports</div>${rows}`:''}</div>`}
async function hydrate(){for(let e of document.querySelectorAll('[data-ids]')){let ids=e.dataset.ids.split(',').filter(Boolean);e.innerHTML='';for(let id of ids){let u=await purl(id,true);if(!u)continue;urls.push(u);let im=document.createElement('img');im.src=u;im.dataset.photoId=id;im.onclick=()=>openPhoto(id);e.appendChild(im)}}if(view.screen==='edit'){await fillGrid('beforeGrid','before');await fillGrid('afterGrid','after')}if(view.screen==='pdfready')await renderGeneratedPdfPreview()}async function fillGrid(id,k){let e=document.getElementById(id);if(!e)return;e.innerHTML='';for(let i=0;i<draft[k].length;i++){let u=await purl(draft[k][i],true);urls.push(u);let d=document.createElement('div');d.className='photo';d.innerHTML=`<img src="${u}"><div class="photoBtns"><button onclick="move('${k}',${i},-1)">←</button><button onclick="remPhoto('${k}',${i})">✕</button><button onclick="move('${k}',${i},1)">→</button></div>`;e.appendChild(d)}}
async function openPhoto(id){let rec=await get('photos',id);if(!rec)return;if(lightboxUrl)URL.revokeObjectURL(lightboxUrl);lightboxUrl=URL.createObjectURL(rec.blob);let d=document.createElement('div');d.id='photoLightbox';d.className='photoLightbox';d.onclick=e=>{if(e.target===d)closePhoto()};d.innerHTML=`<button class="photoLightboxClose" aria-label="Close" onclick="closePhoto()">×</button><img src="${lightboxUrl}">`;document.body.appendChild(d)}function closePhoto(){document.getElementById('photoLightbox')?.remove();if(lightboxUrl){URL.revokeObjectURL(lightboxUrl);lightboxUrl=null}}
async function pdf(){let r=report();if(!state.templateBytes){alert('First select your RELIABLE PDF template in the Template tab.');return}toast('Creating PDF...');let src=await PDFLib.PDFDocument.load(new Uint8Array(state.templateBytes)),out=await PDFLib.PDFDocument.create(),font=await out.embedFont(PDFLib.StandardFonts.Helvetica),bold=await out.embedFont(PDFLib.StandardFonts.HelveticaBold),rgb=PDFLib.rgb,L=48,R=548,TOP=650,BOT=96,W=500,page,y,roomName=null,seq=1,snagsOnPage=0;
async function np(){let[p]=await out.copyPages(src,[1]);out.addPage(p);page=p;y=TOP;roomName=null;snagsOnPage=0;let bx=L,by=664,bw=W,bh=70;page.drawRectangle({x:bx,y:by,width:bw,height:bh,color:rgb(.975,.978,.982),borderColor:rgb(.84,.85,.88),borderWidth:.9});page.drawText('SNAG LIST REPORT',{x:bx+12,y:by+47,size:11.5,font:bold});page.drawText(r.title,{x:bx+12,y:by+18,size:17,font:bold});let dt=fmt(r.date),dtw=font.widthOfTextAtSize(dt,10.5);page.drawText(dt,{x:bx+bw-12-dtw,y:by+20,size:10.5,font})}
async function rh(n){if(y<150)await np();page.drawRectangle({x:L,y:y-23,width:W,height:23,color:rgb(.94,.945,.95)});page.drawText(n,{x:L+8,y:y-16,size:12,font:bold});y-=31;roomName=n}
async function emb(id){let rec=await get('photos',id);if(!rec)return null;return out.embedJpg(new Uint8Array(await rec.blob.arrayBuffer()))}
async function imgs(ids,label){if(!ids.length)return;if(label){page.drawText(label,{x:L+39,y:y-9,size:7.5,font:bold});y-=16}let sx=L+39,areaW=W-51,g=8,pw=(areaW-g*3)/4,ph=pw*(302.35/226.75),rowH=ph+9;for(let start=0;start<ids.length;start+=4){let row=ids.slice(start,start+4);for(let j=0;j<row.length;j++){let im=await emb(row[j]);if(!im)continue;let sc=Math.min(pw/im.width,ph/im.height),ww=im.width*sc,hh=im.height*sc,x=sx+j*(pw+g);page.drawImage(im,{x:x+(pw-ww)/2,y:y-ph+(ph-hh)/2,width:ww,height:hh})}y-=rowH}}
function estimate(s){let br=Math.ceil(s.before.length/4),ar=Math.ceil(s.after.length/4),pw=((W-51)-8*3)/4,ph=pw*(302.35/226.75),rowH=ph+9;return 83+(s.note?18:0)+br*rowH+(ar?18+ar*rowH:0)}
async function snag(s,n,rm){let h=estimate(s);if(snagsOnPage>=2){await np()}let needsRoom=roomName!==rm,roomH=needsRoom?31:0;if(y-roomH-h<BOT){await np()}if(roomName!==rm)await rh(rm);let top=y;page.drawRectangle({x:L,y:y-h+4,width:W,height:h-4,borderColor:rgb(.87,.88,.9),borderWidth:.7});page.drawText(String(n).padStart(2,'0'),{x:L+8,y:y-19,size:10,font:bold});page.drawText(s.title.slice(0,60),{x:L+39,y:y-19,size:10.5,font:bold});y-=25;if(s.note){page.drawText(s.note.slice(0,110),{x:L+39,y:y-10,size:8.5,font});y-=20}let statusX=L+39,statusW=W-51,statusH=22,statusColor=s.resolved?rgb(.76,.93,.80):rgb(1,.87,.58),statusText=s.resolved?'RESOLVED':'OPEN  -  TO BE COMPLETED';page.drawRectangle({x:statusX,y:y-statusH+3,width:statusW,height:statusH,color:statusColor});let tw=bold.widthOfTextAtSize(statusText,9.5);page.drawText(statusText,{x:statusX+(statusW-tw)/2,y:y-12,size:9.5,font:bold});y-=31;await imgs(s.before,'');await imgs(s.after,'AFTER');y=top-h;snagsOnPage++}
await np();for(let a of r.rooms){let ss=a.snags.filter(s=>view.filter==='all'||view.filter==='open'&&!s.resolved||view.filter==='resolved'&&s.resolved);for(let s of ss)await snag(s,seq++,a.name)}let bytes=await out.save({useObjectStreams:true}),blob=new Blob([bytes],{type:'application/pdf'}),name=(r.title+' - Snag Report.pdf').replace(/[\/:*?"<>|]/g,'-'),file=new File([blob],name,{type:'application/pdf'});r.lastPdfBytes=blob.size;r.lastPdfAt=stamp();r.lastPdfFilter=view.filter;await save();generatedPdf={bytes:new Uint8Array(bytes),blob,file,name,size:blob.size};view.screen='pdfready';render()}
function pdfReadyView(){let g=generatedPdf;if(!g)return grad('PDF','No PDF generated',"view.screen='preview';render()")+`<div class="wrap"><button class="btn secondary block" onclick="view.screen='preview';render()">Back to preview</button></div>`;return grad('PDF ready',g.name,"view.screen='preview';render()")+`<div class="wrap"><div class="pdfReadyCard"><div class="pdfMeta"><div><div class="title">${esc(g.name)}</div><div class="small">${mb(g.size)} · PDF</div></div><span class="badge">READY</span></div><div id="pdfCanvasPreview" class="pdfPreviewWrap"><div class="small" style="text-align:center;padding:24px">Rendering PDF preview…</div></div></div><button class="btn primary block" onclick="shareGeneratedPdf()">Share PDF</button><button class="btn secondary block" style="margin-top:8px" onclick="downloadGeneratedPdf()">Save PDF</button><button class="btn secondary block" style="margin-top:8px" onclick="view.screen='preview';render()">Back</button><div class="small" style="text-align:center;margin-top:8px">Share PDF sends the actual file only — no blob link.</div></div>`}
async function renderGeneratedPdfPreview(){let box=document.getElementById('pdfCanvasPreview');if(!box||!generatedPdf)return;try{if(!window.pdfjsLib)throw new Error('PDF preview library unavailable');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';let doc=await pdfjsLib.getDocument({data:generatedPdf.bytes.slice()}).promise;box.innerHTML='';for(let n=1;n<=doc.numPages;n++){let pg=await doc.getPage(n),base=pg.getViewport({scale:1}),target=Math.min(1100,Math.max(620,(box.clientWidth||620)*2)),scale=target/base.width,vp=pg.getViewport({scale}),c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.className='pdfPage';await pg.render({canvasContext:ctx,viewport:vp}).promise;box.appendChild(c)}}catch(e){console.error(e);box.innerHTML='<div class="small" style="text-align:center;padding:24px">Preview unavailable. The PDF is ready to share or save.</div>'}}
async function shareGeneratedPdf(){if(!generatedPdf)return;if(navigator.share&&navigator.canShare?.({files:[generatedPdf.file]})){try{await navigator.share({files:[generatedPdf.file]});return}catch(e){if(e?.name==='AbortError')return;console.error(e)}}downloadGeneratedPdf()}
function downloadGeneratedPdf(){if(!generatedPdf)return;let u=URL.createObjectURL(generatedPdf.blob),a=document.createElement('a');a.href=u;a.download=generatedPdf.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function goReports(){view={screen:'reports',tab:'reports',reportId:null,roomId:null,snagId:null,filter:'all'};render()}function goTemplate(){view.screen='template';view.tab='template';render()}function goSettings(){view.screen='settings';view.tab='settings';render()}function openRep(id){view.reportId=id;view.screen='report';render()}function openRoom(id){view.roomId=id;view.screen='room';render()}
(async()=>{try{await odb();await load();render()}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="wrap"><div class="card"><b>Unable to load OP Snag List.</b><div class="small" style="margin-top:6px">Close and reopen the app. Your stored data has not been deleted.</div></div></div>'}finally{requestAnimationFrame(()=>document.getElementById('splash')?.classList.add('hide'))}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=4.8',{scope:'./'})})();
